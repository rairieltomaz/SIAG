<style>
html,body{height:100%;margin:0;background:#EEF1F5}
#app{height:100%}

body{margin:0}
a{color:#1061A6}a:hover{color:#0B4A80}
input,select,textarea,button{font-family:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:3px solid #9CC8EC;outline-offset:1px}
button:focus-visible{outline:3px solid #9CC8EC;outline-offset:2px}
button:disabled{cursor:not-allowed}

/* ---- responsivo: celular pequeno ---- */
.app-nav{padding-bottom:calc(8px + env(safe-area-inset-bottom)) !important}
@media (max-width: 899px){ input,select,textarea{font-size:16px !important} }
@media (max-width: 380px){
  .faixa-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .app-main,.login-main{padding:12px !important}
}
/* ---- computador ---- */
@media (min-width: 900px){
  .app-root{max-width:none !important}
  .app-shell{display:grid !important;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .app-header{grid-column:1 / -1}
  .app-nav{grid-column:1;grid-row:2;display:flex !important;flex-direction:column;gap:2px !important;padding:16px 0 !important;border-top:0 !important;border-right:1px solid #C9D5E2;overflow-y:auto}
  .nav-btn{flex-direction:row !important;justify-content:flex-start !important;gap:12px !important;height:52px !important;padding:0 20px !important;font-size:14px !important;border-top:0 !important;border-left:4px solid transparent !important;text-align:left}
  .nav-btn[aria-current="page"]{border-left-color:#1061A6 !important}
  .app-main{grid-column:2;grid-row:2;padding:28px 36px !important}
  .page{max-width:1180px;width:100%;margin:0 auto}
  .prog-grid{display:grid !important;grid-template-columns:400px minmax(0,1fr);align-items:start;column-gap:24px !important}
  .prog-grid > *{grid-column:1}
  .prog-grid > h1{grid-column:1 / -1}
  .prog-grid > .prog-table{grid-column:2;grid-row:2 / span 6}
  .ver-body{display:grid !important;grid-template-columns:420px minmax(0,1fr);align-items:start;column-gap:24px !important}
  .ver-body > *{grid-column:2}
  .ver-body > .ver-inputs{grid-column:1;grid-row:1 / span 8;position:sticky;top:0}
  .tt-grid{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .tt-grid > .span-all{grid-column:1 / -1}
  .kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr)) !important}
  .kpi-grid > .kpi-total{grid-column:1 / -1 !important}
  .cfg-grid{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .cfg-grid > h1{grid-column:1 / -1}
  .pw-page{max-width:520px}
  .login-main{align-items:center;justify-content:center;padding:48px 24px !important}
  .login-main > *{width:100%;max-width:460px;box-sizing:border-box}
  .login-main > div[style*="margin-top: auto"]{margin-top:24px !important}
}

</style>

<script>
/* Mini runtime: renders the app template (holes, if/for blocks) and patches the DOM. */
(function () {
  var SVGNS = 'http://www.w3.org/2000/svg';
  var HOLE_FULL = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var HOLE_ANY = /\{\{\s*([^}]+?)\s*\}\}/g;

  function resolve(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return parseFloat(path);
    if (/^'.*'$|^".*"$/.test(path)) return path.slice(1, -1);
    var parts = path.split('.');
    var v = scope[parts[0]];
    for (var i = 1; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    var m = HOLE_FULL.exec(str);
    if (m) return resolve(m[1], scope);
    if (str.indexOf('{{') < 0) return str;
    return str.replace(HOLE_ANY, function (_, p) { var v = resolve(p, scope); return v == null ? '' : String(v); });
  }

  function build(node, scope, out) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      if (t.indexOf('{{') >= 0) { var v = interp(t, scope); t = v == null ? '' : String(v); }
      out.push({ tag: '#', v: t });
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'template' && node.getAttribute('data-k')) {
      var kind = node.getAttribute('data-k');
      var kids = node.content.childNodes, i, j;
      if (kind === 'if') {
        if (interp(node.getAttribute('data-value'), scope)) for (i = 0; i < kids.length; i++) build(kids[i], scope, out);
      } else {
        var list = interp(node.getAttribute('data-list'), scope) || [];
        var as = node.getAttribute('data-as') || 'item';
        for (j = 0; j < list.length; j++) {
          var s2 = Object.create(scope); s2[as] = list[j]; s2.$index = j;
          for (i = 0; i < kids.length; i++) build(kids[i], s2, out);
        }
      }
      return;
    }
    var props = {};
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a];
      props[at.name] = interp(at.value, scope);
    }
    var ch = [];
    var src = tag === 'template' ? node.content.childNodes : node.childNodes;
    for (var c = 0; c < src.length; c++) build(src[c], scope, ch);
    out.push({ tag: tag, props: props, kids: ch, svg: node.namespaceURI === SVGNS });
  }

  function evName(el, k) {
    var e = k.slice(2);
    if (e === 'change' && (el.localName === 'input' || el.localName === 'textarea')) return 'input';
    return e;
  }
  var BOOL = { readonly: 'readOnly', disabled: 'disabled', checked: 'checked' };
  function setProps(el, oldP, newP) {
    var k;
    el._h = el._h || {};
    for (k in oldP) if (!(k in newP)) {
      if (k.slice(0, 2) === 'on') { var en = evName(el, k); el._h[en] = null; }
      else el.removeAttribute(k);
    }
    for (k in newP) {
      var v = newP[k];
      if (k === 'value') continue;
      if (k.slice(0, 2) === 'on') {
        var ev = evName(el, k);
        if (!el._h.hasOwnProperty(ev)) {
          (function (evn) { el.addEventListener(evn, function (e) { var f = el._h[evn]; if (typeof f === 'function') f(e); }); })(ev);
        }
        el._h[ev] = v;
        continue;
      }
      if (BOOL[k]) {
        if (v === true || v === 'true' || v === '') { el.setAttribute(k, ''); el[BOOL[k]] = true; }
        else { el.removeAttribute(k); el[BOOL[k]] = false; }
        continue;
      }
      if (v == null || v === false) { el.removeAttribute(k); continue; }
      if (oldP[k] !== v || el.getAttribute(k) !== String(v)) el.setAttribute(k, String(v));
    }
  }
  function setValue(el, p) {
    if ('value' in p) {
      var v = p.value == null ? '' : String(p.value);
      if (el.value !== v) el.value = v;
    }
  }
  function create(v) {
    if (v.tag === '#') { var t = document.createTextNode(v.v); t._v = v; return t; }
    var el = v.svg ? document.createElementNS(SVGNS, v.tag) : document.createElement(v.tag);
    setProps(el, {}, v.props);
    for (var i = 0; i < v.kids.length; i++) el.appendChild(create(v.kids[i]));
    setValue(el, v.props);
    el._v = v;
    return el;
  }
  function patchKids(parent, kids) {
    var nodes = parent.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var nv = kids[i], cur = nodes[i];
      if (!cur) { parent.appendChild(create(nv)); continue; }
      var ov = cur._v;
      if (!ov || ov.tag !== nv.tag || (nv.tag !== '#' && ov.svg !== nv.svg)) { parent.replaceChild(create(nv), cur); continue; }
      if (nv.tag === '#') { if (cur.nodeValue !== nv.v) cur.nodeValue = nv.v; cur._v = nv; continue; }
      setProps(cur, ov.props, nv.props);
      patchKids(cur, nv.kids);
      setValue(cur, nv.props);
      cur._v = nv;
    }
    while (nodes.length > kids.length) parent.removeChild(nodes[nodes.length - 1]);
  }

  window.DCLogic = function DCLogic() {};
  window.DCLogic.prototype.setState = function (p) {
    var prev = this.state || {};
    var patch = typeof p === 'function' ? p(prev, this.props) : p;
    this.state = Object.assign({}, prev, patch);
    this.__schedule && this.__schedule();
  };
  window.DCLogic.prototype.forceUpdate = function () { this.__schedule && this.__schedule(); };

  window.mountApp = function (rootEl, tplHtml, Comp, props) {
    var tplHost = document.createElement('template');
    tplHost.innerHTML = tplHtml;
    var tpl = tplHost.content;
    var inst = new Comp();
    inst.props = props || {};
    var pending = false, mounted = false;
    function render() {
      pending = false;
      var vals = inst.renderVals();
      var out = [];
      for (var i = 0; i < tpl.childNodes.length; i++) build(tpl.childNodes[i], vals, out);
      patchKids(rootEl, out);
      if (mounted && inst.componentDidUpdate) inst.componentDidUpdate();
    }
    inst.__schedule = function () { if (!pending) { pending = true; Promise.resolve().then(render); } };
    render();
    mounted = true;
    if (inst.componentDidMount) inst.componentDidMount();
    window.addEventListener('pagehide', function () { if (inst.componentWillUnmount) inst.componentWillUnmount(); });

      },
      hasLog: log.length > 0, noLog: log.length === 0, log: log,
      clearLog: function () { self.setState({ log: [] }); },

      // resumo
      energyStr: fmt(energy, 1),
      specStr: energy > 0 ? fmt(total / energy, 1) : '—',
      startsStr: String(starts),
      alertsStr: String(warns + issues.length),
      alertColor: (warns + issues.length) > 0 ? '#B54708' : '#0C2340',
      bars: bars,
      maxVolStr: fmt(maxVol, 0),

      // ajustes
      cfgBasic: cfgList(BASIC),
      cfgDess: cfgList(DESS),
      cfgAdv: cfgList(ADV),
      resetCfg: function () { self.setState({ cfg: Object.assign({}, DEFCFG) }); }
    };
  }
}

g: 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; cursor: pointer\">SAIR</button>\n      </div>\n    </div>\n  </header>\n\n  <main class=\"app-main\" style=\"flex: 1 1 auto; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px\">\n\n    <!-- ============ TROCA DE SENHA ============ -->\n    <template data-k=\"if\" data-value=\"{{ pwView }}\">\n      <div class=\"page pw-page\" style=\"display: flex; flex-direction: column; gap: 14px\">\n        <h1 style=\"margin: 0; padding-bottom: 6px; border-bottom: 2px solid #1061A6; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #0C2340\">{{ pwTitle }}</h1>\n        <template data-k=\"if\" data-value=\"{{ mustChange }}\">\n          <div role=\"alert\" style=\"background: #FFF4E5; border-left: 4px solid #B54708; padding: 10px 12px; font-size: 14px; color: #6B3A00; line-height: 1.4\">Primeiro acesso com a senha padr\u00e3o. Crie uma senha pessoal para continuar.</div>\n        </template>\n        <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-top: 3px solid #1061A6; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-size: 14px; color: #33475E\">Usu\u00e1rio: <b>{{ userName }}</b></div>\n          <template data-k=\"if\" data-value=\"{{ askCurrent }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"pw-cur\" style=\"font-size: 13px; font-weight: 600; color: #33475E\">Senha atual</label>\n              <input id=\"pw-cur\" type=\"password\" autoComplete=\"current-password\" value=\"{{ pwCur }}\" onChange=\"{{ onPwCur }}\" style=\"height: 48px; box-sizing: border-box; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 12px; color: #0C2340; background: #FFFFFF\">\n            </div>\n          </template>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"pw-new\" style=\"font-size: 13px; font-weight: 600; color: #33475E\">Nova senha (m\u00edn. 6 caracteres)</label>\n            <input id=\"pw-new\" type=\"password\" autoComplete=\"new-password\" value=\"{{ pwNew }}\" onChange=\"{{ onPwNew }}\" style=\"height: 48px; box-sizing: border-box; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 12px; color: #0C2340; background: #FFFFFF\">\n          </div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"pw-new2\" style=\"font-size: 13px; font-weight: 600; color: #33475E\">Repita a nova senha</label>\n            <input id=\"pw-new2\" type=\"password\" autoComplete=\"new-password\" value=\"{{ pwNew2 }}\" onChange=\"{{ onPwNew2 }}\" style=\"height: 48px; box-sizing: border-box; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 12px; color: #0C2340; background: #FFFFFF\">\n          </div>\n          <template data-k=\"if\" data-value=\"{{ pwMsgErr }}\">\n            <div role=\"alert\" style=\"font-size: 14px; color: #8A1A12; background: #FDECEA; border-left: 4px solid #B42318; padding: 10px 12px\">{{ pwMsg }}</div>\n          </template>\n          <button type=\"button\" onClick=\"{{ savePw }}\" style=\"height: 50px; border: 0; border-radius: 2px; background: #1061A6; color: #FFFFFF; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer\">SALVAR NOVA SENHA</button>\n          <template data-k=\"if\" data-value=\"{{ canCancelPw }}\">\n            <button type=\"button\" onClick=\"{{ closePw }}\" style=\"height: 44px; border: 1px solid #C9D5E2; border-radius: 2px; background: #FFFFFF; color: #0C2340; cursor: pointer\">Cancelar</button>\n          </template>\n          <template data-k=\"if\" data-value=\"{{ mustChange }}\">\n            <button type=\"button\" onClick=\"{{ logout }}\" style=\"height: 44px; border: 1px solid #C9D5E2; border-radius: 2px; background: #FFFFFF; color: #0C2340; cursor: pointer\">Sair</button>\n          </template>\n        </div>\n        <div style=\"font-size: 12px; color: #4A5B6E; line-height: 1.4\">A senha fica gravada neste aparelho. Em outro celular, a troca precisa ser feita nele tamb\u00e9m.</div>\n      </div>\n    </template>\n\n    <!-- ============ PROGRAMA ============ -->\n    <template data-k=\"if\" data-value=\"{{ isProg }}\">\n      <div class=\"page prog-grid\" style=\"display: flex; flex-direction: column; gap: 14px\">\n        <h1 style=\"margin: 0; padding-bottom: 6px; border-bottom: 2px solid #1061A6; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #0C2340\">Programa\u00e7\u00e3o do ONS</h1>\n\n        <div style=\"background: #FFFFFF; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #C9D5E2\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\">\n            <label for=\"f-date\" style=\"font-size: 14px; font-weight: 600\">Data do PDP <span style=\"color: #B42318\">*</span></label>\n            <input id=\"f-date\" type=\"date\" value=\"{{ date }}\" onChange=\"{{ onDate }}\" style=\"height: 44px; border: 1px solid {{ dateBorder }}; border-radius: 2px; padding: 0 10px; background: #FFFFFF; color: #0C2340\">\n          </div>\n          <div style=\"display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #8A4300\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7v5l3 2\"></path></svg>\n            Hor\u00e1rios de Bras\u00edlia (Manaus \u22121 h)\n          </div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\">\n              <label for=\"f-pcs\" style=\"font-size: 14px; font-weight: 600; line-height: 1.3\">PCS m\u00e9dio medido<br><span style=\"font-size: 12px; font-weight: 400; color: #4A5B6E\">kcal/m\u00b3 \u00b7 opcional</span></label>\n              <input id=\"f-pcs\" type=\"text\" inputMode=\"decimal\" placeholder=\"Ex.: 8435\" value=\"{{ pcsReal }}\" onChange=\"{{ onPcs }}\" style=\"height: 44px; width: 150px; box-sizing: border-box; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 10px; background: #FFFFFF; color: #0C2340; font-variant-numeric: tabular-nums\">\n            </div>\n            <span style=\"font-size: 12px; color: #0B4A80; background: #E8F1FA; border-radius: 2px; padding: 6px 10px; line-height: 1.4\">{{ pcsProgInfo }}</span>\n          </div>\n          <div style=\"height: 8px; background: #E3EAF2; border-radius: 2px; overflow: hidden\">\n            <div style=\"height: 8px; width: {{ progPct }}%; background: {{ progColor }}; border-radius: 2px\"></div>\n          </div>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n            <template data-k=\"if\" data-value=\"{{ complete }}\">\n              <span style=\"font-size: 14px; font-weight: 600; color: #0B7A3E\">\u2713 Programa\u00e7\u00e3o completa</span>\n            </template>\n            <template data-k=\"if\" data-value=\"{{ incomplete }}\">\n              <span style=\"font-size: 14px; font-weight: 600; color: #B42318\">{{ lockReason }}</span>\n            </template>\n            <span style=\"font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: {{ progColor }}\">{{ doneCount }}/48</span>\n          </div>\n        </div>\n\n        <div style=\"background: #FFFFFF; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #C9D5E2\">\n          <div style=\"font-size: 15px; font-weight: 700\">Lan\u00e7ar faixa</div>\n          <div class=\"faixa-grid\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <label for=\"f-de\" style=\"font-size: 12px; color: #4A5B6E\">De</label>\n              <select id=\"f-de\" value=\"{{ fillDeStr }}\" onChange=\"{{ onFillDe }}\" style=\"height: 46px; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 4px; background: #FFFFFF; color: #0C2340; font-variant-numeric: tabular-nums; font-size: 15px\">\n                <template data-k=\"for\" data-list=\"{{ startOpts }}\" data-as=\"o\"><option value=\"{{ o.v }}\">{{ o.t }}</option></template>\n              </select>\n            </div>\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <label for=\"f-ate\" style=\"font-size: 12px; color: #4A5B6E\">At\u00e9</label>\n              <select id=\"f-ate\" value=\"{{ fillAteStr }}\" onChange=\"{{ onFillAte }}\" style=\"height: 46px; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 4px; background: #FFFFFF; color: #0C2340; font-variant-numeric: tabular-nums; font-size: 15px\">\n                <template data-k=\"for\" data-list=\"{{ endOpts }}\" data-as=\"o\"><option value=\"{{ o.v }}\">{{ o.t }}</option></template>\n              </select>\n            </div>\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <label for=\"f-mw\" style=\"font-size: 12px; color: #4A5B6E\">MW</label>\n              <input id=\"f-mw\" type=\"text\" inputMode=\"decimal\" placeholder=\"114\" value=\"{{ fillMw }}\" onChange=\"{{ onFillMw }}\" style=\"height: 46px; box-sizing: border-box; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 8px; font-variant-numeric: tabular-nums; color: #0C2340\">\n            </div>\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <label for=\"f-gt\" style=\"font-size: 12px; color: #4A5B6E\">GTs *</label>\n              <select id=\"f-gt\" value=\"{{ fillGt }}\" onChange=\"{{ onFillGt }}\" style=\"height: 46px; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 4px; background: #FFFFFF; color: #0C2340; font-size: 15px\">\n                <template data-k=\"for\" data-list=\"{{ gtOpts }}\" data-as=\"o\"><option value=\"{{ o.v }}\">{{ o.t }}</option></template>\n              </select>\n            </div>\n          </div>\n          <button type=\"button\" onClick=\"{{ applyFill }}\" style=\"height: 50px; border: 0; border-radius: 0px; background: {{ accent }}; color: #FFFFFF; font-weight: 700; letter-spacing: 0.5px; cursor: pointer\">APLICAR</button>\n          <div style=\"display: flex; justify-content: space-between; gap: 8px\">\n            <button type=\"button\" onClick=\"{{ togglePaste }}\" style=\"height: 44px; border: 0; background: transparent; color: #1061A6; font-weight: 600; padding: 0 4px; cursor: pointer\">Colar coluna do PDPW</button>\n            <button type=\"button\" onClick=\"{{ askClear }}\" style=\"height: 44px; border: 0; background: transparent; color: #B42318; font-weight: 600; padding: 0 4px; cursor: pointer\">Zerar</button>\n          </div>\n          <template data-k=\"if\" data-value=\"{{ confirmClear }}\">\n            <div style=\"background: #FDECEA; border-radius: 2px; padding: 12px; display: flex; flex-direction: column; gap: 10px\">\n              <div style=\"font-size: 14px; color: #6E140E\">Apagar os 48 intervalos (MW e GTs) e as leituras do dia?</div>\n              <div style=\"display: flex; gap: 8px\">\n                <button type=\"button\" onClick=\"{{ doClear }}\" style=\"flex: 1; height: 44px; border: 0; border-radius: 2px; background: #B42318; color: #FFFFFF; font-weight: 600; cursor: pointer\">Sim, apagar</button>\n                <button type=\"button\" onClick=\"{{ cancelClear }}\" style=\"flex: 1; height: 44px; border: 1px solid #C9D5E2; border-radius: 2px; background: #FFFFFF; color: #0C2340; cursor: pointer\">Cancelar</button>\n              </div>\n            </div>\n          </template>\n          <template data-k=\"if\" data-value=\"{{ showPaste }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <label for=\"f-paste\" style=\"font-size: 13px; color: #4A5B6E; line-height: 1.4\">Cole os 48 valores de MW (00:00 a 24:00). Depois lance as GTs por faixa com o MW em branco.</label>\n              <textarea id=\"f-paste\" rows=\"4\" value=\"{{ paste }}\" onChange=\"{{ onPaste }}\" placeholder=\"91&#10;91&#10;45&#10;\u2026\" style=\"border: 1px solid #C9D5E2; border-radius: 2px; padding: 10px; font-variant-numeric: tabular-nums; color: #0C2340; resize: vertical\"></textarea>\n              <button type=\"button\" onClick=\"{{ applyPaste }}\" style=\"height: 46px; border: 0; border-radius: 2px; background: #0B4A80; color: #FFFFFF; font-weight: 600; cursor: pointer\">Aplicar colagem</button>\n            </div>\n          </template>\n          <template data-k=\"if\" data-value=\"{{ msgOk }}\">\n            <div role=\"status\" style=\"font-size: 14px; color: #0B4A80; background: #E8F1FA; border-radius: 2px; padding: 10px 12px\">{{ msg }}</div>\n          </template>\n          <template data-k=\"if\" data-value=\"{{ msgErr }}\">\n            <div role=\"alert\" style=\"font-size: 14px; color: #6E140E; background: #FDECEA; border-radius: 2px; padding: 10px 12px\">{{ msg }}</div>\n          </template>\n        </div>\n\n        <div class=\"prog-table\" style=\"background: #FFFFFF; border-radius: 0px; overflow: hidden; border: 1px solid #C9D5E2\">\n          <div style=\"display: grid; grid-template-columns: 42px 62px 68px minmax(0, 1fr) minmax(0, 1fr); gap: 4px; align-items: end; padding: 10px 8px; font-size: 12px; font-weight: 600; color: #4A5B6E; background: #EEF3F8\">\n            <span>At\u00e9<br><span style=\"font-size: 10px; font-weight: 500\">BSB</span></span><span>MW *</span><span>GTs *</span>\n            <span style=\"text-align: right; display: flex; flex-direction: column; gap: 1px\"><span>Acum. m\u00b3</span><span style=\"font-size: 10px; font-weight: 500\">PCS {{ pcsHdr }}</span></span>\n            <span style=\"text-align: right; display: flex; flex-direction: column; gap: 1px; color: #0B4A80\"><span>Acum. m\u00b3</span><span style=\"font-size: 10px; font-weight: 500\">contrato {{ pcsRefStr }}</span></span>\n          </div>\n          <template data-k=\"for\" data-list=\"{{ rows }}\" data-as=\"r\">\n            <div style=\"display: flex; flex-direction: column; border-top: 1px solid #EDF2F7; background: {{ r.bg }}\">\n              <div style=\"display: grid; grid-template-columns: 42px 62px 68px minmax(0, 1fr) minmax(0, 1fr); gap: 4px; align-items: center; padding: 6px 8px\">\n                <span style=\"font-variant-numeric: tabular-nums; font-size: 14px; color: #33475E\">{{ r.end }}</span>\n                <input type=\"text\" inputMode=\"decimal\" aria-label=\"{{ r.ariaMw }}\" placeholder=\"MW\" value=\"{{ r.mwStr }}\" onChange=\"{{ r.onMw }}\" style=\"height: 40px; box-sizing: border-box; width: 100%; border: 1px solid {{ r.mwBorder }}; border-radius: 2px; padding: 0 8px; font-variant-numeric: tabular-nums; font-size: 16px; color: #0C2340; background: #FFFFFF\">\n                <select aria-label=\"{{ r.ariaGt }}\" value=\"{{ r.gtVal }}\" onChange=\"{{ r.onGt }}\" style=\"height: 40px; box-sizing: border-box; width: 100%; border: 1px solid {{ r.gtBorder }}; border-radius: 2px; padding: 0 4px; font-size: 15px; color: #0C2340; background: #FFFFFF\">\n                  <template data-k=\"for\" data-list=\"{{ gtOpts }}\" data-as=\"o\"><option value=\"{{ o.v }}\">{{ o.t }}</option></template>\n                </select>\n                <span style=\"font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; color: #4A5B6E\">{{ r.accMedStr }}</span>\n                <span style=\"font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; text-align: right; color: #0B4A80\">{{ r.acc94Str }}</span>\n              </div>\n              <template data-k=\"if\" data-value=\"{{ r.hasNote }}\">\n                <div style=\"padding: 0 8px 8px 54px; font-size: 12px; font-weight: 500; color: {{ r.noteColor }}\">{{ r.note }}</div>\n              </template>\n            </div>\n          </template>\n        </div>\n\n        <template data-k=\"if\" data-value=\"{{ complete }}\">\n          <button type=\"button\" onClick=\"{{ goVer }}\" style=\"height: 54px; border: 0; border-radius: 0px; background: {{ accent }}; color: #FFFFFF; font-size: 17px; font-weight: 600; cursor: pointer\">Ir para Verificar \u2192</button>\n        </template>\n        <template data-k=\"if\" data-value=\"{{ incomplete }}\">\n          <button type=\"button\" disabled=\"{{ true }}\" style=\"height: 54px; border: 0; border-radius: 0px; background: #DCE3EA; color: #4A5B6E; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"></rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"></path></svg>\n            {{ lockBtn }}\n          </button>\n        </template>\n      </div>\n    </template>\n\n    <!-- ============ TON / TOFF ============ -->\n    <template data-k=\"if\" data-value=\"{{ isTt }}\">\n      <div class=\"page tt-grid\" style=\"display: flex; flex-direction: column; gap: 14px\">\n        <div class=\"span-all\" style=\"display: flex; justify-content: space-between; align-items: baseline\">\n          <h1 style=\"margin: 0; padding-bottom: 6px; border-bottom: 2px solid #1061A6; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #0C2340\">Ton / Toff</h1>\n          <span style=\"font-variant-numeric: tabular-nums; font-size: 12px; color: #4A5B6E\">agora {{ nowStr }} (Bras\u00edlia)</span>\n        </div>\n        <div class=\"span-all\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n          <div style=\"background: #1061A6; color: #FFFFFF; border-radius: 0px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px\">\n            <span style=\"font-size: 12px; color: #D6E7F7\">Ton \u00b7 m\u00ednimo ligado</span>\n            <span style=\"font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600\">{{ tonStr }}</span>\n          </div>\n          <div style=\"background: #0B4A80; color: #FFFFFF; border-radius: 0px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px\">\n            <span style=\"font-size: 12px; color: #D6E7F7\">Toff \u00b7 m\u00ednimo desligado</span>\n            <span style=\"font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600\">{{ toffStr }}</span>\n          </div>\n        </div>\n\n        <template data-k=\"for\" data-list=\"{{ units }}\" data-as=\"u\">\n          <div class=\"tt-unit\" style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n            <div style=\"font-size: 16px; font-weight: 700\">{{ u.name }}</div>\n            <div style=\"display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 8px\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <label for=\"{{ u.idSt }}\" style=\"font-size: 12px; color: #4A5B6E\">Estado</label>\n                <select id=\"{{ u.idSt }}\" value=\"{{ u.st }}\" onChange=\"{{ u.onSt }}\" style=\"height: 46px; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 6px; background: #FFFFFF; color: #0C2340\">\n                  <option value=\"\">Selecionar</option>\n                  <option value=\"on\">Ligada</option>\n                  <option value=\"off\">Desligada</option>\n                </select>\n              </div>\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <label for=\"{{ u.idSince }}\" style=\"font-size: 12px; color: #4A5B6E\">{{ u.sinceLabel }}</label>\n                <input id=\"{{ u.idSince }}\" type=\"datetime-local\" value=\"{{ u.since }}\" onChange=\"{{ u.onSince }}\" style=\"height: 46px; box-sizing: border-box; width: 100%; min-width: 0; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 6px; background: #FFFFFF; color: #0C2340; font-size: 14px\">\n              </div>\n            </div>\n            <div style=\"font-size: 14px; font-weight: 600; line-height: 1.4; color: {{ u.color }}; background: {{ u.bg }}; border-radius: 2px; padding: 10px 12px\">{{ u.result }}</div>\n            <template data-k=\"if\" data-value=\"{{ u.hasSub }}\">\n              <div style=\"font-size: 13px; color: #4A5B6E\">{{ u.sub }}</div>\n            </template>\n          </div>\n        </template>\n\n        <div class=\"span-all\" style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n          <span style=\"font-size: 15px; font-weight: 700\">Na programa\u00e7\u00e3o do dia</span>\n          <template data-k=\"if\" data-value=\"{{ ttOk }}\">\n            <div style=\"font-size: 14px; color: #0B7A3E; font-weight: 600\">\u2713 Nenhum conflito de Ton ou Toff nas partidas e paradas programadas.</div>\n          </template>\n          <template data-k=\"for\" data-list=\"{{ ttIssues }}\" data-as=\"t\">\n            <div style=\"font-size: 13px; color: #8A4300; display: flex; gap: 8px\"><span style=\"font-variant-numeric: tabular-nums; flex: 0 0 auto\">{{ t.when }}</span><span>{{ t.text }}</span></div>\n          </template>\n        </div>\n\n        <div class=\"span-all\" style=\"background: #FFFFFF; border-radius: 0px; border: 1px solid #C9D5E2; overflow: hidden\">\n          <button type=\"button\" onClick=\"{{ toggleNota }}\" aria-expanded=\"{{ notaExpanded }}\" style=\"width: 100%; min-height: 52px; border: 0; background: #FFFFFF; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; cursor: pointer; color: #0C2340\">\n            <span style=\"display: flex; flex-direction: column; gap: 2px\">\n              <span style=\"font-size: 15px; font-weight: 700\">Nota operacional</span>\n              <span style=\"font-size: 12px; color: #4A5B6E\">DESSEM (ONS) \u00b7 CER-D n\u00ba 464/22, subcl. 5.12.1</span>\n            </span>\n            <span style=\"font-size: 13px; font-weight: 600; color: #1061A6; flex: 0 0 auto\">{{ notaBtn }}</span>\n          </button>\n          <template data-k=\"if\" data-value=\"{{ showNota }}\">\n            <div style=\"padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; color: #33475E; line-height: 1.45\">\n              <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n                <div style=\"background: #EEF3F8; border-radius: 2px; padding: 10px; display: flex; flex-direction: column; gap: 3px\">\n                  <span style=\"font-weight: 700; color: #0C2340\">1 turbina a g\u00e1s</span>\n                  <span>M\u00ednima: <b style=\"font-variant-numeric: tabular-nums\">45,914 MW</b></span>\n                  <span>M\u00e1xima: <b style=\"font-variant-numeric: tabular-nums\">57,393 MW</b></span>\n                  <span>Tempo m\u00edn.: 720 min (12 h)</span>\n                </div>\n                <div style=\"background: #EEF3F8; border-radius: 2px; padding: 10px; display: flex; flex-direction: column; gap: 3px\">\n                  <span style=\"font-weight: 700; color: #0C2340\">2 turbinas a g\u00e1s</span>\n                  <span>M\u00ednima: <b style=\"font-variant-numeric: tabular-nums\">91,828 MW</b></span>\n                  <span>M\u00e1xima: <b style=\"font-variant-numeric: tabular-nums\">114,786 MW</b></span>\n                  <span>Tempo m\u00edn.: 720 min (12 h)</span>\n                </div>\n              </div>\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <span style=\"font-weight: 700; color: #0C2340\">Par\u00e2metros de refer\u00eancia (teto contratual)</span>\n                <span><b>Ton \u2264 12 h</b> \u2014 tempo m\u00ednimo LIGADO, incluindo as rampas.</span>\n                <span><b>Toff \u2264 4 h</b> \u2014 tempo m\u00ednimo DESLIGADO antes de nova partida.</span>\n                <span><b>R-up \u2264 7 h</b> \u2014 rampa de acionamento, da partida \u00e0 plena carga.</span>\n                <span><b>R-dn \u2264 1 h</b> \u2014 rampa de desligamento at\u00e9 a m\u00e1quina fora de servi\u00e7o.</span>\n                <span><b>Gmin/Gmax \u2264 80%</b> \u2014 at\u00e9 onde a usina reduz carga sem desligar.</span>\n              </div>\n              <div style=\"background: #FFF4E5; border-radius: 2px; padding: 10px; color: #6B3A00\">Ap\u00f3s parada da usina ou retirada de uma turbina, a nova rampa de subida s\u00f3 pode ser feita depois de 4 h.</div>\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <span style=\"font-weight: 700; color: #0C2340\">Rampas</span>\n                <span>Subida 1 GT: <span style=\"font-variant-numeric: tabular-nums\">0 \u2192 30 \u2192 45,914 \u2192 57,393</span></span>\n                <span>Subida 2 GTs: <span style=\"font-variant-numeric: tabular-nums\">0 \u2192 60 \u2192 91,828 \u2192 114,786</span></span>\n                <span>Descida 1 GT: <span style=\"font-variant-numeric: tabular-nums\">57,393 \u2192 45,914 \u2192 0</span></span>\n                <span>Descida 2 GTs: <span style=\"font-variant-numeric: tabular-nums\">114,786 \u2192 91,828 \u2192 0</span></span>\n              </div>\n              <div style=\"border: 1px solid #F0B46A; border-radius: 2px; padding: 10px; color: #6B3A00\"><b>Leia como TETO, n\u00e3o como meta.</b> Declarar qualquer valor acima da refer\u00eancia gera penalidade.</div>\n            </div>\n          </template>\n        </div>\n      </div>\n    </template>\n\n    <!-- ============ VERIFICAR ============ -->\n    <template data-k=\"if\" data-value=\"{{ isVer }}\">\n      <div class=\"page\" style=\"display: flex; flex-direction: column; gap: 14px\">\n        <h1 style=\"margin: 0; padding-bottom: 6px; border-bottom: 2px solid #1061A6; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #0C2340\">Verificar consumo</h1>\n\n        <template data-k=\"if\" data-value=\"{{ incomplete }}\">\n          <div role=\"alert\" style=\"background: #FFFFFF; border: 2px solid #B42318; border-radius: 0px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; align-items: center; gap: 10px; color: #8A1A12\">\n              <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"></rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"></path></svg>\n              <span style=\"font-size: 20px; font-weight: 700\">Verifica\u00e7\u00e3o bloqueada</span>\n            </div>\n            <div style=\"font-size: 15px; color: #33475E; line-height: 1.45\">{{ lockReason }} Complete os 48 intervalos (MW e GTs) para liberar.</div>\n            <button type=\"button\" onClick=\"{{ goProg }}\" style=\"height: 50px; border: 0; border-radius: 0px; background: #1061A6; color: #FFFFFF; font-weight: 600; cursor: pointer\">Ir para Programa</button>\n          </div>\n        </template>\n\n        <template data-k=\"if\" data-value=\"{{ complete }}\">\n          <div class=\"ver-body\" style=\"display: flex; flex-direction: column; gap: 14px\">\n            <div class=\"ver-inputs\" style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 16px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <label for=\"v-op\" style=\"font-size: 14px; font-weight: 600\">Operador <span style=\"color: #B42318\">*</span></label>\n                <input id=\"v-op\" type=\"text\" placeholder=\"Nome ou matr\u00edcula\" value=\"{{ operador }}\" onChange=\"{{ onOp }}\" style=\"height: 48px; box-sizing: border-box; width: 100%; border: 1px solid {{ opBorder }}; border-radius: 2px; padding: 0 12px; color: #0C2340; background: #FFFFFF\">\n              </div>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <label for=\"v-hora\" style=\"font-size: 14px; font-weight: 600\">Hor\u00e1rio da leitura <span style=\"color: #B54708\">(Bras\u00edlia)</span> <span style=\"color: #B42318\">*</span></label>\n                <select id=\"v-hora\" value=\"{{ selStr }}\" onChange=\"{{ onSel }}\" style=\"height: 52px; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 12px; background: #FFFFFF; color: #0C2340; font-variant-numeric: tabular-nums; font-size: 18px\">\n                  <template data-k=\"for\" data-list=\"{{ endOpts }}\" data-as=\"o\"><option value=\"{{ o.vSel }}\">{{ o.t }}</option></template>\n                </select>\n              </div>\n              <div style=\"background: #E8F1FA; border-radius: 2px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n                <span style=\"font-size: 14px; color: #0B4A80; line-height: 1.3\">Previsto at\u00e9 {{ selLabel }} \u00b7 {{ selGtStr }}<br><span style=\"font-size: 12px\">{{ baseShort }}</span></span>\n                <span style=\"font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; color: #0B4A80\">{{ prevStr }}</span>\n              </div>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <label for=\"v-med\" style=\"font-size: 14px; font-weight: 600\">Totalizador GRMS (m\u00b3 no dia) <span style=\"color: #B42318\">*</span></label>\n                <input id=\"v-med\" type=\"text\" inputMode=\"numeric\" maxLength=\"6\" placeholder=\"At\u00e9 6 d\u00edgitos \u00b7 ex.: 340300\" value=\"{{ med }}\" onChange=\"{{ onMed }}\" style=\"height: 60px; box-sizing: border-box; width: 100%; border: 2px solid {{ medBorder }}; border-radius: 0px; padding: 0 14px; font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 600; color: #0C2340; background: #FFFFFF\">\n              </div>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <span id=\"lbl-base\" style=\"font-size: 14px; font-weight: 600\">Comparar volumes no PCS</span>\n                <div role=\"group\" aria-labelledby=\"lbl-base\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #1061A6; border-radius: 2px; overflow: hidden\">\n                  <button type=\"button\" onClick=\"{{ setBaseContrato }}\" aria-pressed=\"{{ baseContratoPressed }}\" style=\"height: 48px; border: 0; background: {{ baseContratoBg }}; color: {{ baseContratoFg }}; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px\"><span style=\"font-size: 14px\">Contrato</span><span style=\"font-size: 11px; font-weight: 500\">{{ pcsRefStr }} kcal/m\u00b3</span></button>\n                  <button type=\"button\" onClick=\"{{ setBaseMedido }}\" aria-pressed=\"{{ baseMedidoPressed }}\" style=\"height: 48px; border: 0; background: {{ baseMedidoBg }}; color: {{ baseMedidoFg }}; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px\"><span style=\"font-size: 14px\">Medido</span><span style=\"font-size: 11px; font-weight: 500\">{{ pcsMedLabel }}</span></button>\n                </div>\n              </div>\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <label for=\"v-pcs\" style=\"font-size: 14px; font-weight: 600\">PCS m\u00e9dio medido (kcal/m\u00b3) <span style=\"color: #B42318\">*</span> <span style=\"font-size: 12px; font-weight: 600; color: #0B4A80\">{{ vPcsTag }}</span></label>\n                <div style=\"position: relative\">\n                  <input id=\"v-pcs\" type=\"text\" inputMode=\"decimal\" placeholder=\"Ex.: 8435\" value=\"{{ vPcsVal }}\" onChange=\"{{ onPcs }}\" readOnly=\"{{ pcsLocked }}\" aria-readonly=\"{{ pcsLockedStr }}\" style=\"height: 48px; box-sizing: border-box; width: 100%; border: 1px solid {{ pcsBorder }}; border-radius: 2px; padding: 0 44px 0 12px; font-variant-numeric: tabular-nums; font-size: 17px; font-weight: {{ vPcsWeight }}; color: {{ vPcsColor }}; background: {{ vPcsBg }}\">\n                  <template data-k=\"if\" data-value=\"{{ pcsLocked }}\">\n                    <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0B4A80\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"position: absolute; right: 14px; top: 15px\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"></rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"></path></svg>\n                  </template>\n                </div>\n              </div>\n            </div>\n\n            <template data-k=\"if\" data-value=\"{{ vNoProg }}\">\n              <div style=\"background: #FFFFFF; border: 2px dashed #A9BACB; border-radius: 0px; padding: 20px; text-align: center; color: #4A5B6E; font-size: 15px\">N\u00e3o h\u00e1 g\u00e1s previsto at\u00e9 este hor\u00e1rio.</div>\n            </template>\n            <template data-k=\"if\" data-value=\"{{ vWait }}\">\n              <div style=\"background: #FFFFFF; border: 2px dashed #A9BACB; border-radius: 0px; padding: 20px; text-align: center; color: #4A5B6E; font-size: 15px\">{{ waitMsg }}</div>\n            </template>\n            <template data-k=\"if\" data-value=\"{{ vOk }}\">\n              <div role=\"status\" style=\"background: #E5F4EA; border: 2px solid #0B7A3E; border-radius: 0px; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n                <div style=\"display: flex; align-items: center; gap: 10px; color: #075C2E\">\n                  <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"></circle><path d=\"M7.5 12.5l3 3 6-6\"></path></svg>\n                  <span style=\"font-size: 22px; font-weight: 700\">DENTRO DA TOLER\u00c2NCIA</span>\n                </div>\n                <div style=\"font-variant-numeric: tabular-nums; font-size: 32px; font-weight: 600; color: #075C2E\">{{ devStr }}</div>\n                <div style=\"font-size: 14px; color: #1F4D33\">{{ diffStr }} \u00b7 limite \u00b1{{ tolStr }}</div>\n              </div>\n            </template>\n            <template data-k=\"if\" data-value=\"{{ vFail }}\">\n              <div role=\"alert\" style=\"background: #FDECEA; border: 2px solid #B42318; border-radius: 0px; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n                <div style=\"display: flex; align-items: center; gap: 10px; color: #8A1A12\">\n                  <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2z\"></path><path d=\"M12 10v5\"></path><path d=\"M12 18h.01\"></path></svg>\n                  <span style=\"font-size: 22px; font-weight: 700\">FORA DA TOLER\u00c2NCIA</span>\n                </div>\n                <div style=\"font-variant-numeric: tabular-nums; font-size: 32px; font-weight: 600; color: #8A1A12\">{{ devStr }}</div>\n                <div style=\"font-size: 14px; color: #6E140E\">{{ diffStr }} \u00b7 limite \u00b1{{ tolStr }}</div>\n                <div style=\"font-size: 15px; font-weight: 600; color: #6E140E; line-height: 1.4\">{{ failHint }}</div>\n              </div>\n            </template>\n\n            <template data-k=\"if\" data-value=\"{{ showCorr }}\">\n              <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n                <div style=\"font-size: 14px; font-weight: 600\">Volumes nas duas bases</div>\n                <div style=\"display: grid; grid-template-columns: 70px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; font-size: 12px; color: #4A5B6E; align-items: baseline\">\n                  <span></span><span style=\"text-align: right\">PCS {{ pcsMedShort }}</span><span style=\"text-align: right; color: #0B4A80; font-weight: 600\">Contrato {{ pcsRefStr }}</span>\n                  <span>Previsto</span><span style=\"text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; color: #0C2340\">{{ prevRealStr }}</span><span style=\"text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; color: #0B4A80; font-weight: 600\">{{ prev94Str }}</span>\n                  <span>Medido</span><span style=\"text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; color: #0C2340\">{{ medRealStr }}</span><span style=\"text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; color: #0B4A80; font-weight: 600\">{{ med94Str }}</span>\n                </div>\n                <div style=\"font-size: 12px; color: #4A5B6E; line-height: 1.4\">{{ convNote }}</div>\n              </div>\n            </template>\n\n            <template data-k=\"if\" data-value=\"{{ canSave }}\">\n              <button type=\"button\" onClick=\"{{ saveReading }}\" style=\"height: 54px; border: 0; border-radius: 0px; background: #1061A6; color: #FFFFFF; font-size: 17px; font-weight: 600; cursor: pointer\">Salvar leitura</button>\n            </template>\n            <template data-k=\"if\" data-value=\"{{ cannotSave }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 8px\">\n                <button type=\"button\" disabled=\"{{ true }}\" style=\"height: 54px; border: 0; border-radius: 0px; background: #DCE3EA; color: #4A5B6E; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px\">\n                  <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"></rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"></path></svg>\n                  Salvar leitura\n                </button>\n                <div style=\"background: #FFF4E5; border-radius: 2px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px\">\n                  <div style=\"font-size: 13px; font-weight: 600; color: #6B3A00\">Para salvar, falta:</div>\n                  <template data-k=\"for\" data-list=\"{{ saveIssues }}\" data-as=\"s\">\n                    <div style=\"font-size: 13px; color: #6B3A00\">\u2022 {{ s.text }}</div>\n                  </template>\n                </div>\n              </div>\n            </template>\n\n            <template data-k=\"if\" data-value=\"{{ hasLog }}\">\n              <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; overflow: hidden\">\n                <div style=\"padding: 12px 14px; font-size: 15px; font-weight: 600\">Leituras de hoje</div>\n                <template data-k=\"for\" data-list=\"{{ log }}\" data-as=\"l\">\n                  <div style=\"display: grid; grid-template-columns: 56px minmax(0, 1fr) 76px; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid #EDF2F7; font-size: 14px\">\n                    <span style=\"font-variant-numeric: tabular-nums\">{{ l.hora }}</span>\n                    <span style=\"font-variant-numeric: tabular-nums; color: #33475E\">{{ l.medStr }} m\u00b3</span>\n                    <span style=\"font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; color: {{ l.color }}\">{{ l.devStr }}</span>\n                  </div>\n                </template>\n              </div>\n            </template>\n          </div>\n        </template>\n      </div>\n    </template>\n\n    <!-- ============ RESUMO ============ -->\n    <template data-k=\"if\" data-value=\"{{ isRes }}\">\n      <div class=\"page\" style=\"display: flex; flex-direction: column; gap: 14px\">\n        <h1 style=\"margin: 0; padding-bottom: 6px; border-bottom: 2px solid #1061A6; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #0C2340\">Resumo do dia</h1>\n        <template data-k=\"if\" data-value=\"{{ incomplete }}\">\n          <div role=\"alert\" style=\"background: #FDECEA; color: #6E140E; border-radius: 0px; padding: 12px 14px; font-size: 14px; line-height: 1.4\">Valores parciais: {{ lockReason }}</div>\n        </template>\n        <div class=\"kpi-grid\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n          <div class=\"kpi-total\" style=\"background: #1061A6; color: #FFFFFF; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 4px; grid-column: span 2\">\n            <span style=\"font-size: 13px; color: #D6E7F7\">G\u00e1s previsto no dia \u00b7 base contrato {{ pcsRefStr }} kcal/m\u00b3</span>\n            <span style=\"font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 600\">{{ totalStr }} m\u00b3</span>\n            <span style=\"font-size: 13px; color: #D6E7F7\">{{ totalRealStr }} \u00b7 m\u00e9dia {{ avgMwStr }} MW</span>\n          </div>\n          <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 4px\">\n            <span style=\"font-size: 13px; color: #4A5B6E\">Energia programada</span>\n            <span style=\"font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600\">{{ energyStr }} MWh</span>\n          </div>\n          <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 4px\">\n            <span style=\"font-size: 13px; color: #4A5B6E\">Consumo espec\u00edfico</span>\n            <span style=\"font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600\">{{ specStr }} m\u00b3/MWh</span>\n          </div>\n          <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 4px\">\n            <span style=\"font-size: 13px; color: #4A5B6E\">Partidas de GT</span>\n            <span style=\"font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600\">{{ startsStr }}</span>\n          </div>\n          <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 4px\">\n            <span style=\"font-size: 13px; color: #4A5B6E\">Intervalos com aviso</span>\n            <span style=\"font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; color: {{ alertColor }}\">{{ alertsStr }}</span>\n          </div>\n        </div>\n\n        <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"font-size: 15px; font-weight: 600\">G\u00e1s previsto a cada 30 min</div>\n          <div style=\"display: flex; gap: 14px; font-size: 12px; color: #4A5B6E; flex-wrap: wrap\">\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; border-radius: 2px; background: #0B4A80\"></span>2 GTs</span>\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; border-radius: 2px; background: #3BA3CF\"></span>1 GT</span>\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; border-radius: 2px; background: #D9822B\"></span>Aviso / erro</span>\n          </div>\n          <div style=\"height: 120px; display: flex; align-items: flex-end; gap: 1px; border-bottom: 1px solid #A9BACB\">\n            <template data-k=\"for\" data-list=\"{{ bars }}\" data-as=\"b\">\n              <div title=\"{{ b.tip }}\" style=\"flex: 1 1 0; min-width: 0; height: {{ b.h }}px; background: {{ b.c }}; border-radius: 0\"></div>\n            </template>\n          </div>\n          <div style=\"display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; font-size: 11px; color: #4A5B6E\">\n            <span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>24h</span>\n          </div>\n          <div style=\"font-size: 12px; color: #4A5B6E\">Maior volume em 30 min: {{ maxVolStr }} m\u00b3</div>\n        </div>\n\n        <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; overflow: hidden\">\n          <div style=\"padding: 12px 14px; font-size: 15px; font-weight: 600\">Leituras registradas</div>\n          <template data-k=\"if\" data-value=\"{{ noLog }}\">\n            <div style=\"padding: 0 14px 14px; font-size: 14px; color: #4A5B6E\">Nenhuma leitura salva ainda.</div>\n          </template>\n          <template data-k=\"for\" data-list=\"{{ log }}\" data-as=\"l\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-top: 1px solid #EDF2F7\">\n              <div style=\"display: grid; grid-template-columns: 56px minmax(0, 1fr) 76px; gap: 8px; align-items: center; font-size: 14px\">\n                <span style=\"font-variant-numeric: tabular-nums\">{{ l.hora }}</span>\n                <span style=\"font-variant-numeric: tabular-nums; color: #33475E\">{{ l.medStr }} / {{ l.prevStr }}</span>\n                <span style=\"font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; color: {{ l.color }}\">{{ l.devStr }}</span>\n              </div>\n              <div style=\"font-size: 12px; color: #4A5B6E; padding-left: 64px\">{{ l.info }}</div>\n            </div>\n          </template>\n          <template data-k=\"if\" data-value=\"{{ hasLog }}\">\n            <div style=\"padding: 10px 14px 14px; display: flex; justify-content: flex-end\">\n              <button type=\"button\" onClick=\"{{ clearLog }}\" style=\"height: 40px; border: 1px solid #E3B4AE; border-radius: 2px; background: #FFFFFF; color: #9B1C14; padding: 0 14px; cursor: pointer\">Apagar leituras</button>\n            </div>\n          </template>\n        </div>\n      </div>\n    </template>\n\n    <!-- ============ AJUSTES ============ -->\n    <template data-k=\"if\" data-value=\"{{ isCfg }}\">\n      <div class=\"page cfg-grid\" style=\"display: flex; flex-direction: column; gap: 14px\">\n        <h1 style=\"margin: 0; padding-bottom: 6px; border-bottom: 2px solid #1061A6; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #0C2340\">Ajustes</h1>\n        <template data-k=\"if\" data-value=\"{{ isAdmin }}\">\n        <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"font-size: 15px; font-weight: 600\">Usu\u00e1rios</div>\n            <div style=\"font-size: 13px; color: #4A5B6E; line-height: 1.4\">Administrador: acesso total e cadastro de usu\u00e1rios. Regula\u00e7\u00e3o: altera os Ajustes, sem cadastro. Opera\u00e7\u00e3o: sem acesso aos Ajustes.</div>\n          </div>\n          <template data-k=\"for\" data-list=\"{{ userList }}\" data-as=\"u\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid #EDF2F7\">\n              <div style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n                <span style=\"font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ u.login }}</span>\n                <span style=\"font-size: 12px; color: #4A5B6E\">{{ u.roleLabel }}</span>\n              </div>\n              <template data-k=\"if\" data-value=\"{{ u.canRemove }}\">\n                <button type=\"button\" onClick=\"{{ u.remove }}\" style=\"height: 40px; border: 1px solid #E3B4AE; border-radius: 2px; background: #FFFFFF; color: #9B1C14; padding: 0 12px; cursor: pointer\">Remover</button>\n              </template>\n            </div>\n          </template>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #EDF2F7; padding-top: 12px\">\n            <div style=\"font-size: 14px; font-weight: 600\">Redefinir senha de um usu\u00e1rio</div>\n            <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <label for=\"r-user\" style=\"font-size: 12px; color: #4A5B6E\">Usu\u00e1rio</label>\n                <select id=\"r-user\" value=\"{{ resetLogin }}\" onChange=\"{{ onResetLogin }}\" style=\"height: 46px; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 6px; background: #FFFFFF; color: #0C2340\">\n                  <option value=\"\">Selecionar</option>\n                  <template data-k=\"for\" data-list=\"{{ userList }}\" data-as=\"u\"><option value=\"{{ u.login }}\">{{ u.login }}</option></template>\n                </select>\n              </div>\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <label for=\"r-pass\" style=\"font-size: 12px; color: #4A5B6E\">Nova senha (m\u00edn. 6)</label>\n                <input id=\"r-pass\" type=\"password\" autoComplete=\"new-password\" value=\"{{ resetP }}\" onChange=\"{{ onResetP }}\" style=\"height: 46px; box-sizing: border-box; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 12px; color: #0C2340\">\n              </div>\n            </div>\n            <button type=\"button\" onClick=\"{{ doReset }}\" style=\"height: 48px; border: 1px solid #1061A6; border-radius: 2px; background: #FFFFFF; color: #1061A6; font-weight: 600; cursor: pointer\">Redefinir senha</button>\n            <div style=\"font-size: 12px; color: #4A5B6E\">O usu\u00e1rio precisar\u00e1 criar uma senha pessoal no pr\u00f3ximo acesso.</div>\n          </div>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #EDF2F7; padding-top: 12px\">\n            <div style=\"font-size: 14px; font-weight: 600\">Cadastrar novo usu\u00e1rio</div>\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <label for=\"n-user\" style=\"font-size: 12px; color: #4A5B6E\">Login</label>\n              <input id=\"n-user\" type=\"text\" autoCapitalize=\"none\" autoComplete=\"off\" value=\"{{ newU }}\" onChange=\"{{ onNewU }}\" style=\"height: 46px; box-sizing: border-box; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 12px; color: #0C2340\">\n            </div>\n            <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 8px\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <label for=\"n-pass\" style=\"font-size: 12px; color: #4A5B6E\">Senha (m\u00edn. 6)</label>\n                <input id=\"n-pass\" type=\"password\" autoComplete=\"new-password\" value=\"{{ newP }}\" onChange=\"{{ onNewP }}\" style=\"height: 46px; box-sizing: border-box; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 12px; color: #0C2340\">\n              </div>\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <label for=\"n-role\" style=\"font-size: 12px; color: #4A5B6E\">Perfil</label>\n                <select id=\"n-role\" value=\"{{ newRole }}\" onChange=\"{{ onNewRole }}\" style=\"height: 46px; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 6px; background: #FFFFFF; color: #0C2340\">\n                  <option value=\"oper\">Opera\u00e7\u00e3o</option>\n                  <option value=\"reg\">Regula\u00e7\u00e3o</option>\n                  <option value=\"admin\">Administrador</option>\n                </select>\n              </div>\n            </div>\n            <button type=\"button\" onClick=\"{{ addUser }}\" style=\"height: 48px; border: 0; border-radius: 0px; background: #1061A6; color: #FFFFFF; font-weight: 600; cursor: pointer\">Cadastrar</button>\n            <template data-k=\"if\" data-value=\"{{ userMsgOk }}\">\n              <div role=\"status\" style=\"font-size: 14px; color: #0B4A80; background: #E8F1FA; border-radius: 2px; padding: 10px 12px\">{{ userMsg }}</div>\n            </template>\n            <template data-k=\"if\" data-value=\"{{ userMsgErr }}\">\n              <div role=\"alert\" style=\"font-size: 14px; color: #6E140E; background: #FDECEA; border-radius: 2px; padding: 10px 12px\">{{ userMsg }}</div>\n            </template>\n          </div>\n        </div>\n        </template>\n        <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"font-size: 15px; font-weight: 600\">Verifica\u00e7\u00e3o</div>\n          <template data-k=\"for\" data-list=\"{{ cfgBasic }}\" data-as=\"f\">\n            <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; align-items: center\">\n              <label for=\"{{ f.id }}\" style=\"font-size: 14px; line-height: 1.3\">{{ f.label }} <span style=\"color: #4A5B6E\">({{ f.unit }})</span></label>\n              <input id=\"{{ f.id }}\" type=\"text\" inputMode=\"decimal\" value=\"{{ f.val }}\" onChange=\"{{ f.onChange }}\" style=\"height: 44px; box-sizing: border-box; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 10px; font-variant-numeric: tabular-nums; font-size: 16px; color: #0C2340\">\n            </div>\n          </template>\n        </div>\n        <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"font-size: 15px; font-weight: 600\">Limites DESSEM / contrato</div>\n            <div style=\"font-size: 13px; color: #4A5B6E; line-height: 1.4\">Pot\u00eancia l\u00edquida, igual \u00e0 do PDP. Para 2 GTs o app usa o dobro.</div>\n          </div>\n          <template data-k=\"for\" data-list=\"{{ cfgDess }}\" data-as=\"f\">\n            <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; align-items: center\">\n              <label for=\"{{ f.id }}\" style=\"font-size: 14px; line-height: 1.3\">{{ f.label }} <span style=\"color: #4A5B6E\">({{ f.unit }})</span></label>\n              <input id=\"{{ f.id }}\" type=\"text\" inputMode=\"decimal\" value=\"{{ f.val }}\" onChange=\"{{ f.onChange }}\" style=\"height: 44px; box-sizing: border-box; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 10px; font-variant-numeric: tabular-nums; font-size: 16px; color: #0C2340\">\n            </div>\n          </template>\n        </div>\n        <div style=\"background: #FFFFFF; border: 1px solid #C9D5E2; border-radius: 0px; padding: 14px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"font-size: 15px; font-weight: 600\">Modelo da usina (engenharia)</div>\n            <div style=\"font-size: 13px; color: #4A5B6E; line-height: 1.4\">Valores do teste de 96 h e do heat balance. S\u00f3 altere com orienta\u00e7\u00e3o da engenharia.</div>\n          </div>\n          <template data-k=\"for\" data-list=\"{{ cfgAdv }}\" data-as=\"f\">\n            <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; align-items: center\">\n              <label for=\"{{ f.id }}\" style=\"font-size: 14px; line-height: 1.3\">{{ f.label }} <span style=\"color: #4A5B6E\">({{ f.unit }})</span></label>\n              <input id=\"{{ f.id }}\" type=\"text\" inputMode=\"decimal\" value=\"{{ f.val }}\" onChange=\"{{ f.onChange }}\" style=\"height: 44px; box-sizing: border-box; width: 100%; border: 1px solid #C9D5E2; border-radius: 2px; padding: 0 10px; font-variant-numeric: tabular-nums; font-size: 15px; color: #0C2340\">\n            </div>\n          </template>\n          <button type=\"button\" onClick=\"{{ resetCfg }}\" style=\"height: 44px; border: 1px solid #C9D5E2; border-radius: 2px; background: #FFFFFF; color: #0C2340; cursor: pointer\">Restaurar valores padr\u00e3o</button>\n        </div>\n        <div style=\"background: #EEF3F8; border-radius: 0px; padding: 14px; font-size: 13px; color: #33475E; line-height: 1.5; display: flex; flex-direction: column; gap: 6px\">\n          <div style=\"font-weight: 600; color: #0C2340\">Como o app calcula</div>\n          <div>1. Pot\u00eancia bruta = MW do ONS \u00d7 rela\u00e7\u00e3o bruta/l\u00edquida.</div>\n          <div>2. GTs: definidas pelo operador (obrigat\u00f3rio). Bloqueia pot\u00eancia sem GT e acima da m\u00e1xima DESSEM arredondada para MW inteiro (1 GT: 57,393 MW; 2 GTs: 115 MW).</div>\n          <div>3. Vaz\u00e3o (m\u00b3/h) = k \u00d7 (n\u00ba GTs \u00d7 a + b \u00d7 pot\u00eancia bruta).</div>\n          <div>4. Volume em 30 min = vaz\u00e3o \u00d7 0,5, acumulado desde 00:00.</div>\n          <div>5. Desvio = (medido \u2212 previsto) \u00f7 previsto; dentro se |desvio| \u2264 toler\u00e2ncia.</div>\n          <div>6. Ton/Toff: avisa parada antes de 12 h ligada ou partida antes de 4 h desligada.</div>\n        </div>\n      </div>\n    </template>\n  </main>\n\n  <nav class=\"app-nav\" aria-label=\"Navega\u00e7\u00e3o\" style=\"flex: 0 0 auto; display: grid; grid-template-columns: repeat({{ navCols }}, minmax(0, 1fr)); gap: 0; background: #FFFFFF; border-top: 1px solid #C9D5E2; padding: 0 0 8px\">\n    <button type=\"button\" onClick=\"{{ goProg }}\" class=\"nav-btn\" aria-current=\"{{ nav.progCur }}\" style=\"height: 56px; border: 0; border-top: 3px solid {{ nav.progBd }}; border-radius: 0; background: {{ nav.progBg }}; color: {{ nav.progFg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; cursor: pointer\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"></rect><path d=\"M3 9h18\"></path><path d=\"M8 2v4\"></path><path d=\"M16 2v4\"></path></svg>\n      Programa\n    </button>\n    <button type=\"button\" onClick=\"{{ goTt }}\" class=\"nav-btn\" aria-current=\"{{ nav.ttCur }}\" style=\"height: 56px; border: 0; border-top: 3px solid {{ nav.ttBd }}; border-radius: 0; background: {{ nav.ttBg }}; color: {{ nav.ttFg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; cursor: pointer\">\n      <svg width=\"22\" or\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20V10\"></path><path d=\"M10 20V4\"></path><path d=\"M16 20v-7\"></path><path d=\"M22 20H2\"></path></svg>\n      Resumo\n    </button>\n    <template data-k=\"if\" data-value=\"{{ canCfg }}\">\n    <button type=\"button\" onClick=\"{{ goCfg }}\" class=\"nav-btn\" aria-current=\"{{ nav.cfgCur }}\" style=\"height: 56px; border: 0; border-top: 3px solid {{ nav.cfgBd }}; border-radius: 0; background: {{ nav.cfgBg }}; color: {{ nav.cfgFg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; cursor: pointer\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h10\"></path><path d=\"M18 6h2\"></path><circle cx=\"16\" cy=\"6\" r=\"2\"></circle><path d=\"M4 12h4\"></path><path d=\"M12 12h8\"></path><circle cx=\"10\" cy=\"12\" r=\"2\"></circle><path d=\"M4 18h12\"></path><circle cx=\"18\" cy=\"18\" r=\"2\"></circle></svg>\n      Ajustes\n    </button>\n    </template>\n  </nav>\n  </div>\n  </template>\n</div>\n", Component, { accent: "#1061A6" });
