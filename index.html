<style>
html,body{height:100%;margin:0;background:#EEF1F5}
#app{height:100%}

body{margin:0}
a{color:#1061A6}a:hover{color:#0B4A80}
input,select,textarea,button{font-family:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:3px solid #9CC8EC;outline-offset:1px}
button:focus-visible{outline:3px solid #9CC8EC;outline-offset:2px}
button:disabled{cursor:not-allowed}
@keyframes siag-spin{to{transform:rotate(360deg)}}
.siag-spin{animation:siag-spin .8s linear infinite;transform-origin:50% 50%}

/* ---- responsivo: celular pequeno ---- */
.app-nav{padding-bottom:calc(8px + env(safe-area-inset-bottom)) !important}
@media (max-width: 899px){ input,select,textarea{font-size:16px !important} }
@media (max-width: 380px){
  .faixa-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .app-main,.login-main{padding:12px !important}
}
/* ---- computador ---- */
@media (min-width: 900px){
  .app-root{max-width:none !important}
  .app-shell{display:grid !important;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .app-header{grid-column:1 / -1}
  .app-nav{grid-column:1;grid-row:2;display:flex !important;flex-direction:column;gap:2px !important;padding:16px 0 !important;border-top:0 !important;border-right:1px solid #C9D5E2;overflow-y:auto}
  .nav-btn{flex-direction:row !important;justify-content:flex-start !important;gap:12px !important;height:52px !important;padding:0 20px !important;font-size:14px !important;border-top:0 !important;border-left:4px solid transparent !important;text-align:left}
  .nav-btn[aria-current="page"]{border-left-color:#1061A6 !important}
  .app-main{grid-column:2;grid-row:2;padding:28px 36px !important}
  .page{max-width:1180px;width:100%;margin:0 auto}
  .prog-grid{display:grid !important;grid-template-columns:400px minmax(0,1fr);align-items:start;column-gap:24px !important}
  .prog-grid > *{grid-column:1}
  .prog-grid > h1{grid-column:1 / -1}
  .prog-grid > .prog-table{grid-column:2;grid-row:2 / span 6}
  .ver-body{display:grid !important;grid-template-columns:420px minmax(0,1fr);align-items:start;column-gap:24px !important}
  .ver-body > *{grid-column:2}
  .ver-body > .ver-inputs{grid-column:1;grid-row:1 / span 8;position:sticky;top:0}
  .tt-grid{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .tt-grid > .span-all{grid-column:1 / -1}
  .kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr)) !important}
  .kpi-grid > .kpi-total{grid-column:1 / -1 !important}
  .cfg-grid{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .cfg-grid > h1{grid-column:1 / -1}
  .pw-page{max-width:520px}
  .login-main{align-items:center;justify-content:center;padding:48px 24px !important}
  .login-main > *{width:100%;max-width:460px;box-sizing:border-box}
  .login-main > div[style*="margin-top: auto"]{margin-top:24px !important}
}

</style>

<script>
/* Mini runtime: renders the app template (holes, if/for blocks) and patches the DOM. */
(function () {

        self.setState({ log: lg, med: '', sel: Math.min(47, sel + 2) });
        self.openShare(receiptRec(rec));
      },
      hasLog: log.length > 0, noLog: log.length === 0, log: log,
      clearLog: function () { self.setState({ log: [] }); },

      // resumo
      energyStr: fmt(energy, 1),
      specStr: energy > 0 ? fmt(total / energy, 1) : '—',
      startsStr: String(starts),
      alertsStr: String(warns + issues.length),
      alertColor: (warns + issues.length) > 0 ? '#B54708' : '#0C2340',
      bars: bars,
      maxVolStr: fmt(maxVol, 0),

      // ajustes
      cfgBasic: cfgList(BASIC),
      cfgDess: cfgList(DESS),
      cfgAdv: cfgList(ADV),
      resetCfg: function () { self.setState({ cfgDraft: Object.assign({}, DEFCFG), draftOld: false, cfgMsg: '' }); },
      cfgPending: draftKeys.length > 0, cfgClean: draftKeys.length === 0,
      cfgPendingTxt: draftKeys.length === 1 ? '1 alteração ainda não publicada' : draftKeys.length + ' alterações ainda não publicadas',
      cfgPendingList: draftKeys.map(function (k) { return { label: CFG_LABEL[k] || k, from: String(cfgRaw[k]), to: String(cfgForm[k]) }; }),
      draftOld: draftKeys.length > 0 && !!st.draftOld,
      cfgInfo: (function () {
        var cdb = st.cdb, at = cdb ? brOfIso(cdb.at) : NaN;
        if (!cdb) return st.cdbSrc === 'cache' || !st.cdbSrc ? 'Usando os valores padrão do app (ajustes centrais ainda não baixados).' : 'Usando os valores padrão do app (nenhum ajuste publicado ainda).';
        return (st.cdbSrc === 'cache' ? 'Sem conexão · usando os últimos ajustes baixados' : 'Ajustes centrais em uso') + (isFinite(at) ? ' · publicados em ' + fmtDT(at) + (cdb.by ? ' por ' + cdb.by : '') : '');
      })(),
      cfgMsgOk: !!st.cfgMsg && st.cfgMsgKind === 'ok', cfgMsgErr: !!st.cfgMsg && st.cfgMsgKind === 'err', cfgMsgInfo: !!st.cfgMsg && st.cfgMsgKind === 'info', cfgMsg: st.cfgMsg,
      pubCfgLabel: busy ? 'PUBLICANDO…' : 'PUBLICAR PARA TODOS OS APARELHOS',
      discardCfg: function () { self.setState({ cfgDraft: null, draftOld: false, cfgMsgKind: 'ok', cfgMsg: 'Alterações descartadas. Valem os ajustes publicados.' }); },
      publishCfg: function () {
        var cs = self.cur();
        if (!canEditCfg || cs.busy) return;
        var central = Object.assign({}, DEFCFG, cs.cdb ? cs.cdb.cfg : {});
        var keys = cfgDiff(cs.cfgDraft, central);
        if (!keys.length) { self.setState({ cfgMsgKind: 'ok', cfgMsg: 'Nada para publicar.' }); return; }
        var bad = keys.map(function (k) { var m = cfgCheck(k, cs.cfgDraft[k]); return m ? (CFG_LABEL[k] || k) + ': ' + m : ''; }).filter(Boolean);
        if (bad.length) { self.setState({ cfgMsgKind: 'err', cfgMsg: 'Corrija antes de publicar — ' + bad.join('; ') + '.' }); return; }
        var tok = getToken();
        if (!tok) { self.setState({ cfgMsgKind: 'err', cfgMsg: 'Configure o token do GitHub (card "Publicação no GitHub", no topo de Ajustes) para publicar.' }); return; }
        var changes = {};
        keys.forEach(function (k) { changes[k] = String(cs.cfgDraft[k]).trim(); });
        var me = cs.session ? cs.session.login : '';
        self.setState({ busy: true, cfgMsgKind: 'info', cfgMsg: 'Publicando…' });
        ghPublishFile(CFG_FILE, parseCdb, function (curr) {
          // aplica só o que foi alterado aqui sobre a versão mais nova (não desfaz mudança de outra pessoa)
          return cdbToFile(Object.assign({}, DEFCFG, curr ? curr.cfg : {}, changes), me);
        }, tok, 'ajustes de cálculo (' + keys.map(function (k) { return k + '=' + changes[k]; }).join(', ') + ')').then(function (nc) {
          self.setState({ busy: false, cfgDraft: null, draftOld: false });
          self.applyCdb(nc, 'github');
          self.setState({ cfgMsgKind: 'ok', cfgMsg: 'Ajustes publicados. Já valem em todos os aparelhos.' });
        }, function (e) {
          if (e && e.tok) { setToken(''); self.setState({ hasTok: false, tokIn: '', tokMsg: '' }); }
          self.setState({ busy: false, cfgMsgKind: 'err', cfgMsg: e.message || String(e) });
        });
      }
    };
  }
}
